[package]
name = "infinity-configurator"
description = "Declarative product configurators: schema validation, migrations, transforms and output emission."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
infinity-ipc = { workspace = true }
serde = { workspace = true }
# `preserve_order`: emitted payloads must keep the stored key order so they
# stay byte-identical to v3 (the T-38 gauge golden depends on it).
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
