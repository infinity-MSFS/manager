[package]
name = "infinity-installer"
description = "Downloads, verifies and installs product packages, and keeps track of what is installed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
infinity-ipc = { workspace = true }
infinity-persistence = { workspace = true }
fs4 = "0.13"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = { version = "0.4", default-features = false }
zstd = { version = "0.14", default-features = false }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["net", "io-util"] }

[lints]
workspace = true
