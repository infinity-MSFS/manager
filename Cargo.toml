[workspace]
resolver = "3"
members = [
    "crates/ipc",
    "crates/providers",
    "crates/auth",
    "crates/persistence",
    "crates/sim-watch",
    "crates/app",
    "apps/desktop",
    "frontend",
    "xtask",
]
default-members = [
    "crates/ipc",
    "crates/providers",
    "crates/auth",
    "crates/persistence",
    "crates/sim-watch",
    "crates/app",
    "apps/desktop",
    "xtask",
]

[workspace.package]
version = "4.0.0-alpha.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
authors = ["Infinity Simulations"]
repository = "https://github.com/infinity-MSFS/manager"
publish = false

[workspace.dependencies]
# Internal
infinity-ipc = { path = "crates/ipc" }
infinity-providers = { path = "crates/providers" }
infinity-auth = { path = "crates/auth" }
infinity-app = { path = "crates/app" }
infinity-persistence = { path = "crates/persistence" }
infinity-sim-watch = { path = "crates/sim-watch" }

# Shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Native
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", default-features = false }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"

# Frontend
leptos = { version = "0.8.20", features = ["csr"] }
leptos_router = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
serde-wasm-bindgen = "0.6"
send_wrapper = "0.6"
console_error_panic_hook = "0.1"
infinity-ui = { git = "https://github.com/infinity-MSFS/infinity-ui", rev = "a6183e4a7ed11ae0fa4b818972a2b30ddc4ce11c", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
